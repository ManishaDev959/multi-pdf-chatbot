name: Build and deploy Python app to Azure Web App - pdfloader

on:
  push:
    branches:
      - 'backend'
  workflow_dispatch:

# Only one deployment at a time; a second run waits instead of colliding (409)
concurrency:
  group: deploy-pdfloader
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Optional check that the requirements install. Azure (Oryx) installs them again on the server.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # Virtual environments are excluded so the upload stays small
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !venv/
            !.venv/
            !venv_old/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # required for requesting the JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_140669BE93BC4956909FDE54BF0BC65E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7A39A4C2F9AC424A94B6EEC7D97CF65C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4DB46436C3FD4E458A491DFB6CF05F0B }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'pdfloader'
          slot-name: 'Production'
          # clean: true   # see the note below before turning this on
